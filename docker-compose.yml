services:
  # Gateway mode. Salesforce credentials arrive per request on X-Salesforce-*
  # headers. Do not set SALESFORCE_CLIENT_ID, SALESFORCE_CLIENT_SECRET,
  # SALESFORCE_USERNAME, SALESFORCE_PASSWORD, SALESFORCE_TOKEN, or env_file
  # here — that would put static vendor credentials in the container. The
  # project .env is used only for Compose interpolation of CONDUIT_S2S_SECRET.
  # For AUTH_MODE=env, pass SALESFORCE_* on that process instead (see the README).
  salesforce-mcp:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - MCP_TRANSPORT=http
      - PORT=8080
      - MCP_HTTP_HOST=0.0.0.0
      - AUTH_MODE=gateway
      - LOG_LEVEL=info
      - CONDUIT_S2S_SECRET=${CONDUIT_S2S_SECRET:?set CONDUIT_S2S_SECRET}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

# Compose interpolates CONDUIT_S2S_SECRET from the project .env (or the shell).
# Leave it empty in .env.example; never commit a real value. The gateway
# service does not receive SALESFORCE_* — those headers are injected per request.
# CONDUIT_S2S_SECRET=
